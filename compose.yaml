services:
  mysql:
    image: mysql:8.4
    container_name: gym-venue-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: extreme_sports_venue
    ports:
      - "3308:3306"
    volumes:
      - gym-mysql-data:/var/lib/mysql
  redis:
    image: redis:7.4-alpine
    container_name: gym-venue-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gym-redis-data:/data

volumes:
  gym-mysql-data:
  gym-redis-data:
